name: Desktop build and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    # The private runner uses the owner's installed DevExpress development tools.
    # It does not execute pull-request workflows or store proprietary DLLs in Git.
    if: github.repository == 'HandsomeHeise/PS4Manager'
    runs-on: [self-hosted, Windows, X64, ps4manager-devexpress]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native syntax checker when available
        shell: pwsh
        run: |
          if (Test-Path scripts/build-lua.ps1) {
            ./scripts/build-lua.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Restore and build desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build PS4Manager.sln -c Release -v minimal 2>&1 | Tee-Object artifacts/desktop-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test complete desktop solution
        shell: pwsh
        run: dotnet test PS4Manager.sln -c Release --no-build --logger trx --results-directory artifacts/test-results -v minimal
      - name: Verify and package
        shell: pwsh
        run: |
          ./scripts/test-package-client.ps1 -FixtureRoot (Join-Path artifacts ('package-fixture-' + [guid]::NewGuid().ToString('N')))
          ./scripts/package-client.ps1 -OutputPath artifacts/PS4Manager-Windows.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: PS4Manager-Windows-${{ github.sha }}
          path: |
            artifacts/PS4Manager-Windows.zip
            artifacts/desktop-build.log
            artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14
      - name: Create private tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = 'Automated Windows build. Extract the ZIP into a new folder and launch PS4Manager.exe. Settings remain in LocalAppData.'
          $arguments = @('release','create',$env:GITHUB_REF_NAME,'artifacts/PS4Manager-Windows.zip','--repo',$env:GITHUB_REPOSITORY,'--verify-tag','--title',('PS4Manager ' + $env:GITHUB_REF_NAME))
          if (Select-String -LiteralPath artifacts/desktop-build.log -Pattern 'DX1000|DX1001|DX1002' -Quiet) {
            $arguments += '--prerelease'
            $notes += ' DevExpress currently reports an evaluation license: private owner evaluation only, not a distributable production release.'
          }
          $arguments += @('--notes',$notes)
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
