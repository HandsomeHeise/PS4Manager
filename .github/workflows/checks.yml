name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test FTP, file and gallery cores
        shell: pwsh
        run: |
          foreach ($project in @('Ps4.Core.Tests','FileManager.Core.Tests','PS4Manager.Gallery.Core.Tests')) {
            dotnet test "tests/$project/$project.csproj" -c Release -v minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Build isolated deployment test images
        run: |
          docker build -t ps4manager-mods-api -f Dockerfile .
          docker build -t ps4manager-mods-backup -f backup/Dockerfile .
      - run: npm run test:deployment
